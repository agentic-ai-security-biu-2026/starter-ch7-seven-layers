services:
  agent:
    image: docker.io/library/python:3.12-slim
    command: ["python", "-c", "print('ch5 insecure agent stub'); import time; time.sleep(3600)"]
    environment:
      - DISABLE_LAYERS=${DISABLE_LAYERS:-}
  redteam:
    image: docker.io/library/python:3.12-slim
    profiles: ["redteam"]
    command: ["python", "-c", "print('ch5 redteam stub')"]
    depends_on: [agent]
